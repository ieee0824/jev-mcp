name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Check formatting
        run: cargo +1.88.0 fmt --check

      - name: Run Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.88.0 test --locked

      - name: Validate Japanese evaluation fixture
        run: cargo +1.88.0 run --locked -- eval validate eval/ja-coding-minimal.jsonl
